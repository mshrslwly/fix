    <script>
      // Early suppression of Vite HMR WebSocket connection errors in container environment
      (function() {
        function isWsError(e) {
          if (!e) return false;
          var msg = String((e && e.message) || (e && e.reason) || e);
          return msg.indexOf('WebSocket') !== -1 || msg.indexOf('websocket') !== -1;
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.error) || isWsError(event.message)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
    </script>
